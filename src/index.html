<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strata</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
    <!-- Première étape, au premier lancement : la langue (gardée ensuite, changeable en haut à droite) -->
    <section id="language" class="language" hidden>
        <img class="logo" src="logo.svg" alt="">
        <h1>Strata</h1>
        <p class="language-question"><span lang="fr">Choisis ta langue</span> · <span lang="en">Choose your language</span></p>
        <div class="dropdown dropdown-large" id="language-picker"></div>
        <button class="primary language-continue" id="language-continue" type="button"></button>
    </section>

    <header class="head">
        <img class="logo" src="logo.svg" alt="">
        <div>
            <h1>Strata</h1>
            <p class="subtitle" data-i18n="subtitle"></p>
        </div>
        <div class="head-side">
            <div class="dropdown dropdown-small" id="lang-switch"></div>
            <span class="release" id="release"></span>
        </div>
    </header>

    <main>
        <section id="installs" class="installs" aria-live="polite">
            <p class="empty" data-i18n="searching"></p>
        </section>

        <section id="status" class="status" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span id="status-text"></span>
        </section>

        <p class="notice" data-i18n="notice"></p>
    </main>

    <footer class="foot">
        <span data-i18n="tos"></span>
        <span class="source">github.com/DevRedious/strata</span>
    </footer>

    <template id="install-card">
        <article class="card">
            <div class="card-icon"><img src="chat.svg" alt=""></div>
            <div class="card-text">
                <div class="card-title"><span class="label"></span> <span class="version"></span></div>
                <div class="card-state"><span class="badge"></span><span class="running" data-i18n="running"></span></div>
            </div>
            <div class="card-actions">
                <button class="ghost uninstall" type="button" data-i18n="uninstall"></button>
                <button class="primary install" type="button"></button>
            </div>
        </article>
    </template>
</body>
</html>
