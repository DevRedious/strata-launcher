[package]
name = "strata-launcher"
version = "0.2.0"
description = "Installeur de Strata, une distribution de Vencord pour Discord"
authors = ["DevRedious"]
license = "GPL-3.0-or-later"
repository = "https://github.com/DevRedious/strata-launcher"
edition = "2021"

[lib]
name = "strata_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS du système (magasin de certificats Windows) : passe les antivirus qui
# inspectent le HTTPS et les proxys d'entreprise, contrairement à rustls seul
ureq = { version = "3.5", default-features = false, features = ["native-tls", "json", "win-system-proxy"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
# Pas de compression de l'exe (UPX) : les antivirus s'en méfient
codegen-units = 1
lto = true
opt-level = "s"
strip = true
